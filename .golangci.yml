# HyperFleet Credential Provider golangci-lint v2 Configuration
# Required linters (16):
# - Code Quality (9): errcheck, govet, staticcheck, ineffassign, unused, unconvert, unparam, goconst, exhaustive
# - Code Style (6): gofmt, goimports, misspell, lll, revive, gocritic
# - Security (1): gosec

version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    # Code Quality (9 linters)
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - unconvert
    - unparam
    - goconst
    - exhaustive
    # Code Style (4 linters)
    - misspell
    - lll
    - revive
    - gocritic
    # Security (1 linter)
    - gosec

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - encoding/json.(*Encoder).Encode
        - (github.com/openshift-hyperfleet/hyperfleet-credential-provider/pkg/logger.Logger).Sync

    goconst:
      min-len: 3
      min-occurrences: 4

    misspell:
      locale: US
      ignore-rules:
        - cancelled

    lll:
      line-length: 120

    revive:
      confidence: 0.1
      rules:
        - name: exported
          disabled: true
        - name: var-naming
          disabled: true
        - name: package-comments
          disabled: true
        - name: unused-parameter
          disabled: true
        - name: indent-error-flow
          disabled: true
        - name: empty-block
          disabled: true
        - name: context-as-argument
          disabled: true
        - name: redefines-builtin-id
          disabled: true

    exhaustive:
      default-signifies-exhaustive: true
      default-case-required: false

    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
        - elseif
        - exitAfterDefer

  exclusions:
    generated: strict
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Relaxed rules for test files
      - path: '(.+)_test\.go'
        linters:
          - gosec
          - errcheck
          - unparam
          - goconst
          - lll
          - gocritic
          - exhaustive
      # Relaxed rules for testutil package
      - path: 'internal/testutil/'
        linters:
          - gosec
          - errcheck
          - unparam
          - goconst
          - lll
          - gocritic
          - exhaustive
      # Relaxed rules for cmd/
      - path: 'cmd/'
        linters:
          - revive
          - lll
      # Relaxed rules for internal packages
      - path: 'internal/'
        linters:
          - lll
      # Relaxed rules for pkg/
      - path: 'pkg/'
        linters:
          - lll
      # G304: file inclusion via variable - acceptable for credential loader
      - path: 'internal/credentials/loader\.go'
        text: 'G304'
        linters:
          - gosec
      # G101: False positive on ErrorCode constants (not actual credentials)
      - path: 'pkg/errors/codes\.go'
        text: 'G101'
        linters:
          - gosec
      # unparam: Utility functions designed to accept defaults even if currently unused
      - path: 'internal/config/loader\.go'
        text: 'defaultValue always receives'
        linters:
          - unparam
      # QF1008: TypeMeta embedded field access is Kubernetes API convention
      - path: 'internal/execplugin/'
        text: 'QF1008'
        linters:
          - staticcheck

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
